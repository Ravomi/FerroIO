[workspace]
resolver = "2"
members = [
    "crates/ravom-core",
    "crates/ravom-plugin",
    "crates/ravom-cli",
    "crates/ravom-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ravom-core = { path = "crates/ravom-core" }
ravom-plugin = { path = "crates/ravom-plugin" }
eframe = "0.31"
egui = "0.31"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
wildcard_imports = "warn"
