  <!-- Title & Subtitle -->
  <text x="448" y="454" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="74" font-weight="700" fill="#FAFAFA" letter-spacing="-1.6">RavomIO</text>
  <text x="448" y="502" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="24" font-weight="400" fill="#A3A3A3">The PlatformIO for Rust Embedded Development</text>

  <!-- 2x2 Pure Monochrome Feature Cards -->
  <!-- Card 1 -->
  <g transform="translate(60 580)">
    <rect width="376" height="176" rx="18" fill="#121212" stroke="#262626" stroke-width="1.2" />
    <line x1="28" y1="1.2" x2="76" y2="1.2" stroke="#FAFAFA" stroke-width="3" stroke-linecap="round" />
    <text x="188" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="29" font-weight="700" fill="#FAFAFA">2,328 Boards</text>
    <text x="188" y="106" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="18.5" fill="#9C9C9C">39 platforms: STM32, ESP32,</text>
    <text x="188" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="18.5" fill="#9C9C9C">RP2040, nRF &amp; Linux SBC</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(460 580)">
    <rect width="376" height="176" rx="18" fill="#121212" stroke="#262626" stroke-width="1.2" />
    <line x1="28" y1="1.2" x2="76" y2="1.2" stroke="#FAFAFA" stroke-width="3" stroke-linecap="round" />
    <text x="188" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="29" font-weight="700" fill="#FAFAFA">AI-Native MCP</text>
    <text x="188" y="106" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="18.5" fill="#9C9C9C">Full-loop HIL, bounded</text>
    <text x="188" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="18.5" fill="#9C9C9C">serial telemetry &amp; PID tuning</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(60 784)">
    <rect width="376" height="176" rx="18" fill="#121212" stroke="#262626" stroke-width="1.2" />
    <line x1="28" y1="1.2" x2="76" y2="1.2" stroke="#FAFAFA" stroke-width="3" stroke-linecap="round" />
    <text x="188" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="29" font-weight="700" fill="#FAFAFA">VOFA+ Serial Studio</text>
    <text x="188" y="106" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="18.5" fill="#9C9C9C">FireWater, JustFloat,</text>
    <text x="188" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="18.5" fill="#9C9C9C">16-ch scope &amp; command deck</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(460 784)">
    <rect width="376" height="176" rx="18" fill="#121212" stroke="#262626" stroke-width="1.2" />
    <line x1="28" y1="1.2" x2="76" y2="1.2" stroke="#FAFAFA" stroke-width="3" stroke-linecap="round" />
    <text x="188" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="29" font-weight="700" fill="#FAFAFA">Ravomi Workbench</text>
    <text x="188" y="106" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="18.5" fill="#9C9C9C">Monochrome native IDE,</text>
    <text x="188" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="18.5" fill="#9C9C9C">probe-rs flash &amp; Doctor</text>
  </g>

  <!-- Bottom CLI Pill -->
  <g transform="translate(60 1022)">
    <rect width="776" height="62" rx="31" fill="#121212" stroke="#303030" stroke-width="1.2" />
    <text x="388" y="39" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="20" font-weight="500" fill="#E5E5E5" letter-spacing="0.6">
      $ mio init  <tspan fill="#666666">·</tspan>  mio build  <tspan fill="#666666">·</tspan>  mio flash --monitor
    </text>
  </g>

  <!-- Footer -->
  <text x="448" y="1142" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="17" fill="#7A7A7A">github.com/Ravomi/RavomIO  ·  Rust 2021  ·  MIT / Apache-2.0</text>
