      <stop offset="0%" stop-color="#222222" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#090909" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Pure Black Background -->
  <rect x="0" y="0" width="896" height="1200" fill="#090909" />
  <rect x="0" y="0" width="896" height="1200" fill="url(#poster-glow)" />

  <!-- Subtle Engineering Grid -->
  <g stroke="#151515" stroke-width="1">
    <line x1="0" y1="150" x2="896" y2="150" />
    <line x1="0" y1="300" x2="896" y2="300" />
    <line x1="0" y1="450" x2="896" y2="450" />
    <line x1="0" y1="600" x2="896" y2="600" />
