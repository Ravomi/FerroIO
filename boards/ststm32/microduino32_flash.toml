id = "microduino32_flash"
name = "Microduino Core STM32 to Flash"
vendor = "Microduino"
platform = "ststm32"
mcu = "STM32F103CBT6"
cpu = "cortex-m3"
default_framework = "arduino"
frameworks = [
    "arduino",
    "cmsis",
    "stm32cube",
    "libopencm3",
]
probe_rs_chip = "STM32F103CB"
rust_target = "thumbv7m-none-eabi"
flash_bytes = 108000
ram_bytes = 20480
